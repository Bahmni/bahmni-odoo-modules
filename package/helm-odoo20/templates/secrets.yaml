apiVersion: v1
kind: Secret
metadata:
  name: {{ .Chart.Name }}-secrets
  labels:
    app: {{ .Chart.Name }}
    environment: {{ .Values.metadata.labels.environment }}
type: Opaque
data:
  USER: {{ .Values.secrets.ODOO_DB_USER | b64enc | quote }}
  PASSWORD: {{ .Values.secrets.ODOO_DB_PASSWORD | b64enc | quote }}
