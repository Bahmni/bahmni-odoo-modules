apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Chart.Name }}-config
  labels:
    app: {{ .Chart.Name }}
    environment: {{ .Values.metadata.labels.environment }}
data:
  TZ: "{{ .Values.config.TZ }}"
  HOST: "{{ .Values.config.ODOO_DB_HOST }}"
  NAME: "{{ .Values.config.ODOO_DB_NAME }}"
  DB_FILTER: "{{ .Values.config.ODOO_DB_FILTER }}"
