global:
  storageClass: ""
  nodeSelector: {}
  affinity: {}
  tolerations: []

replicaCount: 1

containerPort: 8069

metadata:
  labels:
    environment: dev

image:
  repository: bahmni
  name: odoo-20
  tag: latest
  pullPolicy: IfNotPresent

volumes:
  odoodata:
    capacity: "1Gi"

config:
  TZ: ""
  ODOO_DB_HOST: ""
  ODOO_DB_NAME: ""
  ODOO_DB_FILTER: ".*"

secrets:
  ODOO_DB_USER: ""
  ODOO_DB_PASSWORD: ""

service:
  type: ClusterIP
  port: 8069

resources: {}
nodeSelector: {}
affinity: {}
tolerations: []
